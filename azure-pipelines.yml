trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during Azure DevOps setup
  azureSubscription: 'lab-subscription'
  acrRegistryName: 'pobouracr123'
  imageName: 'sample-app'
  kubernetesServiceConnection: 'myAKSCluster-k8s-connection' # We will map this in Azure DevOps
  aksClusterName: 'myAKSCluster'
  resourceGroupName: 'rg-k8s-demo'

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    displayName: Build job
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageName)
        dockerfile: '**/Dockerfile'
        containerRegistry: 'acr-service-connection' # Update to your Azure DevOps ACR Service Connection name
        tags: |
          latest
          $(Build.BuildId)

- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy job
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: KubernetesManifest@1
      displayName: Deploy to Kubernetes cluster
      inputs:
        action: deploy
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureSubscription)'
        azureResourceGroup: '$(resourceGroupName)'
        kubernetesCluster: '$(aksClusterName)'
        namespace: 'default'
        manifests: |
          $(System.DefaultWorkingDirectory)/K8s/deployment.yaml
          $(System.DefaultWorkingDirectory)/K8s/service.yaml
        imagePullSecrets: |
          pobouracr123-auth # Optional if ACR-AKS attachment is active, but safe to include
        containers: |
          $(acrRegistryName).azurecr.io/$(imageName):latest